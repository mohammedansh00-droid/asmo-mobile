name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install & Synchronize Dependencies
        run: |
          npm install
          npx expo install expo-asset expo-font
          npx expo install --fix
          npx expo prebuild --platform android --clean

      - name: Build Standalone Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: ASMO-Studio-App-Release
          path: android/app/build/outputs/apk/release/*.apk
